  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

20, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"24d460d3-ee48-4aa4-b58d-5a8b2f0ae910\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"90f8a533-2d21-4ff9-adb6-b05407657713\"><\u002Fscript>\n\n<style>\n  :root{\n    --bg:#05060a;\n    --bg-2:#0a0d18;\n    --ink:#e7f3ff;\n    --ink-dim:#7d8aa3;\n    --ink-faint:#3a4258;\n    --cy:#00f0ff;       /* primary neon — cyan */\n    --mg:#ff2a6d;       /* secondary neon — magenta */\n    --lm:#9dff5b;       /* accent — lime/active */\n    --am:#ffb648;       /* warning amber */\n    --grid: rgba(0,240,255,.06);\n    --grid-strong: rgba(0,240,255,.12);\n    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;\n    --sans: 'Space Grotesk', system-ui, sans-serif;\n  }\n\n  html,body{background:#000;color:var(--ink);margin:0;font-family:var(--sans);}\n  deck-stage{\n    --slide-bg: var(--bg);\n    --stage-bg: #000;\n  }\n\n  /* ---------- slide base ---------- */\n  .slide{\n    position:relative;\n    width:1920px;height:1080px;\n    background:\n      radial-gradient(1200px 600px at 85% -10%, rgba(255,42,109,.10), transparent 60%),\n      radial-gradient(900px 700px at -10% 110%, rgba(0,240,255,.10), transparent 60%),\n      linear-gradient(180deg, #06070d 0%, #03050a 100%);\n    color:var(--ink);\n    overflow:hidden;\n    font-family:var(--sans);\n    isolation:isolate;\n  }\n  .slide::before{\n    /* grid */\n    content:\"\";position:absolute;inset:0;\n    background-image:\n      linear-gradient(var(--grid) 1px, transparent 1px),\n      linear-gradient(90deg, var(--grid) 1px, transparent 1px);\n    background-size:80px 80px, 80px 80px;\n    mask-image: radial-gradient(ellipse at 50% 50%, #000 30%, transparent 90%);\n    pointer-events:none; z-index:0;\n  }\n  .slide::after{\n    /* scanlines */\n    content:\"\"; position:absolute; inset:0;\n    background-image: repeating-linear-gradient(\n      0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px);\n    pointer-events:none; z-index:1; mix-blend-mode: overlay;\n  }\n  .slide > *{ position:relative; z-index:2; }\n\n  /* ---------- chrome ---------- */\n  .chrome{\n    position:absolute; inset:48px 56px auto 56px;\n    display:flex; align-items:center; justify-content:space-between;\n    font-family:var(--mono); font-size:20px; color:var(--ink-dim);\n    letter-spacing:.08em; text-transform:uppercase;\n    white-space:nowrap;\n  }\n  .chrome > *, .chrome span{white-space:nowrap;}\n  .chrome .left{display:flex;align-items:center;gap:18px;white-space:nowrap;}\n  .chrome .right{display:flex;align-items:center;gap:24px;white-space:nowrap;}\n  .dot{width:10px;height:10px;border-radius:50%;background:var(--lm);\n       box-shadow:0 0 12px var(--lm);}\n  .pip{color:var(--cy);}\n  .pip-mg{color:var(--mg);}\n  .bar{width:80px;height:1px;background:linear-gradient(90deg,var(--cy),transparent);}\n\n  .footer{\n    position:absolute; left:56px; right:56px; bottom:40px;\n    display:flex; align-items:center; justify-content:space-between;\n    font-family:var(--mono); font-size:20px; color:var(--ink-faint);\n    letter-spacing:.1em; text-transform:uppercase;\n    white-space:nowrap;\n  }\n  .footer > *{white-space:nowrap;}\n  .footer .sn{color:var(--ink-dim);}\n  .footer .crt{color:var(--cy);}\n\n  /* ---------- typography ---------- */\n  .eyebrow{\n    font-family:var(--mono); font-weight:500; font-size:24px;\n    color:var(--cy); letter-spacing:.28em; text-transform:uppercase;\n    display:flex; align-items:center; gap:14px;\n    white-space:nowrap;\n  }\n  .eyebrow span{white-space:nowrap;}\n  .eyebrow .num{\n    color:var(--mg);\n  }\n  .eyebrow::before{\n    content:\"\"; width:14px; height:14px; background:var(--cy);\n    clip-path: polygon(0 0,100% 0,100% 70%,70% 100%,0 100%);\n  }\n  h1.title{\n    font-family:var(--sans); font-weight:700;\n    font-size:104px; line-height:.95; letter-spacing:-.02em;\n    margin:0;\n    color:var(--ink);\n  }\n  h2.title{\n    font-family:var(--sans); font-weight:600;\n    font-size:84px; line-height:.95; letter-spacing:-.02em; margin:0;\n  }\n  .accent{color:var(--cy);}\n  .accent-mg{color:var(--mg);}\n  .lead{\n    font-size:30px; line-height:1.35; color:var(--ink); max-width:1400px;\n    font-weight:400;\n  }\n  .lead .em{ color:var(--cy); }\n  p.body{font-size:24px; line-height:1.45; color:var(--ink-dim);}\n  .mono{font-family:var(--mono);}\n\n  /* ---------- panel / card ---------- */\n  .panel{\n    background:linear-gradient(180deg, rgba(0,240,255,.04), rgba(0,240,255,0));\n    border:1px solid rgba(0,240,255,.18);\n    position:relative;\n  }\n  .panel::before,.panel::after{\n    content:\"\"; position:absolute; width:14px; height:14px; border:2px solid var(--cy);\n  }\n  .panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0;}\n  .panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0;}\n  .panel-mg{border-color:rgba(255,42,109,.25);}\n  .panel-mg::before,.panel-mg::after{border-color:var(--mg);}\n\n  .tag{\n    display:inline-flex; align-items:center; gap:8px;\n    font-family:var(--mono); font-size:14px; letter-spacing:.18em;\n    text-transform:uppercase; color:var(--cy);\n    padding:6px 12px; border:1px solid rgba(0,240,255,.4);\n  }\n  .tag.mg{color:var(--mg); border-color:rgba(255,42,109,.45);}\n  .tag.lm{color:var(--lm); border-color:rgba(157,255,91,.4);}\n  .tag.am{color:var(--am); border-color:rgba(255,182,72,.4);}\n\n  /* corner crosshair */\n  .crosshair{position:absolute; width:24px; height:24px;}\n  .crosshair::before,.crosshair::after{content:\"\"; position:absolute; background:var(--cy);}\n  .crosshair::before{left:50%; top:0; bottom:0; width:1px; transform:translateX(-5
